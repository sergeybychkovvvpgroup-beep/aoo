- desc: aoo rebuild and install
  tags:
  - aoo
  - make
  - update
  actions:
  - desc: make
    template: cd {{aoo_app_dir}} && make update
    args: []
- desc: aoo git add commit push
  tags:
  - aoo
  - git
  - push
  actions:
  - desc: git
    template: cd {{aoo_app_dir}} && git add . && git commit -m "{{message}}" && git push
    args:
    - name: message
      prompt: Commit message
      example: update aoo
- desc: aoo notes git pull
  tags:
  - notes
  - git
  - pull
  actions:
  - desc: git
    template: git -C {{aoo_notes_dir}} pull --rebase
    args: []
- desc: aoo notes git add commit push
  tags:
  - notes
  - git
  - push
  actions:
  - desc: git
    template: git -C {{aoo_notes_dir}} add . && git -C {{aoo_notes_dir}} commit -m "{{message}}" && git -C {{aoo_notes_dir}} push
    args:
    - name: message
      prompt: Commit message
      example: update notes
- desc: ssh to host
  tags:
  - ssh
  actions:
  - desc: ssh
    template: ssh {{user}}@{{host}}
    args:
    - name: user
      prompt: SSH user
      example: root
    - name: host
      prompt: Host or IP
      example: 192.168.1.10
