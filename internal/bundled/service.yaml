- desc: aoo-help
  text: |-
    aoo = terminal notes + command launcher.

    Start:
      aoo
      aoo --query ssh

    Main keys:
      Enter = open/run
      Ctrl+E = edit
      Ctrl+N = new note
      Esc = quit

    Settings:
      run: aoo config
      inspect: aoo config show

    Validate notes:
      aoo validate --dir ~/.local/share/aoo/notes

    Useful searches:
      ssh
      vyos
      git
      theme
      aoo
