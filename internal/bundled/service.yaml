- desc: aoo-help
  mode: show
  note: |
    aoo = terminal notes + command launcher.

    Start:
      aoo
      aoo --query ssh

    Setup notes source:
      aoo set-source
      aoo set-folder ~/.local/share/aoo/notes
      aoo set-app-dir ~/workspace/aoo

    Theme:
      aoo themes
      aoo set-theme nord
      aoo --theme nord

    Check config:
      aoo config show

    Validate notes:
      aoo validate --dir ~/.local/share/aoo/notes

    Useful searches:
      ssh
      vyos
      git
      theme
      aoo

- desc: aoo set source
  mode: run
  run: aoo set-source
  tags: [aoo, setup, source]

- desc: aoo config show
  mode: run
  run: aoo config show
  tags: [aoo, config]

- desc: aoo list themes
  mode: run
  run: aoo themes
  tags: [aoo, theme]

- desc: aoo version
  mode: run
  run: aoo version
  tags: [aoo, version]

- desc: aoo make build
  mode: run
  run: make build
  tags: [aoo, make, build]

- desc: aoo make update
  mode: run
  run: sudo make update
  tags: [aoo, make, install, update]

- desc: aoo make test
  mode: run
  run: make test
  tags: [aoo, make, test]

- desc: aoo make validate
  mode: run
  run: make validate
  tags: [aoo, make, validate]
