- desc: f help
  text: |-
    f = terminal notes + command launcher.
    Old name: aoo.

    Start:
      f
      f --query ssh

    Main keys:
      Enter = open/run
      Ctrl+E = edit
      Ctrl+N = new note
      Esc = quit

    Search:
      plain query = notes/files
      :query or >query = commands only

    Settings:
      run: f config
      inspect: f config show

    Validate notes:
      f validate --dir ~/.local/share/aoo/notes

    Upgrade utility:
      f upgrade
