name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Tidy
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o bin/aoo ./cmd/aoo
      - name: Validate notes
        run: ./bin/aoo validate --dir ./examples/notes
