- desc: example web url
  mode: show
  note: |
    https://service.example.local

- desc: example ssh jump
  mode: run
  run: ssh admin@example.local

- desc: example tunnel
  mode: run
  banner: |
    Open in browser:
    https://127.0.0.1:8443
  run: ssh -L 8443:10.0.0.10:443 admin@example.local

- desc: example built-in vars
  mode: run
  template: echo app={{aoo_app_dir}} notes={{aoo_notes_dir}}
  args: []
