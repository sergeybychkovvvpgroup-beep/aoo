- desc: example web url
  actions:
  - desc: show
    text: https://service.example.local
- desc: example ssh jump
  actions:
  - desc: show
    text: primary ssh access
  - desc: ssh
    cmd: ssh admin@example.local
- desc: example tunnel
  actions:
  - desc: show
    text: local https access
  - desc: tunnel 8443
    cmd: ssh -L 8443:10.0.0.10:443 admin@example.local
    banner: |-
      Open in browser:
      https://127.0.0.1:8443
- desc: example multi-run host
  actions:
  - desc: show
    text: multiple access methods
  - desc: ssh
    cmd: ssh admin@example.local
  - desc: https tunnel
    cmd: ssh -L 8443:10.0.0.10:443 admin@example.local
    banner: |-
      Open in browser:
      https://127.0.0.1:8443
- desc: example built-in vars
  actions:
  - desc: show
    text: inspect built-in variables
  - desc: print vars
    template: echo app={{aoo_app_dir}} notes={{aoo_notes_dir}}
    args: []
