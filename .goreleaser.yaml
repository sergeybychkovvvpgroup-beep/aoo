version: 2

project_name: aoo

before:
  hooks:
    - go mod tidy

builds:
  - id: aoo
    main: ./cmd/aoo
    binary: aoo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: packages
    package_name: aoo
    vendor: Sergey Bychkov
    homepage: https://github.com/sergeybychkovvvpgroup-beep/aoo
    maintainer: Sergey Bychkov
    description: Terminal notes and command launcher with fuzzy search
    formats:
      - deb
    bindir: /usr/bin
    contents:
      - src: ./README.md
        dst: /usr/share/doc/aoo/README.md
