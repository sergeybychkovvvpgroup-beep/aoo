version: 2

project_name: aoo

before:
  hooks:
    - go mod tidy

builds:
  - id: aoo
    main: ./cmd/aoo
    binary: aoo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: packages
    package_name: aoo
    vendor: sergeyb
    homepage: https://github.com/sergeyb/aoo
    maintainer: sergeyb
    description: Fast terminal notes and command launcher
    formats:
      - deb
    bindir: /usr/bin
